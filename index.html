<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes films Ghibli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f2f1; --panel:#ffffff; --ink:#1e3a34; --muted:#5d7a73; --line:#cfe0dd;
  --accent:#f0b43c; --accent-ink:#3b2a00; --seen:#3f8f6b; --seen-bg:#dff2e8; --unseen-bg:#f4ecd6; --unseen:#8a6a1c;
  --shadow:0 1px 0 rgba(30,58,52,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1e1f; --panel:#172b2c; --ink:#e4f0ec; --muted:#8fb0a8; --line:#264244;
    --seen:#6fd0a0; --seen-bg:#1c3a30; --unseen-bg:#3a3118; --unseen:#e6c166; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1e1f; --panel:#172b2c; --ink:#e4f0ec; --muted:#8fb0a8; --line:#264244;
  --seen:#6fd0a0; --seen-bg:#1c3a30; --unseen-bg:#3a3118; --unseen:#e6c166; --shadow:none;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic",ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}

/* tirage */
.draw{background:var(--panel);border:2px solid var(--ink);border-radius:20px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.draw-main{flex:1 1 220px;min-width:0}
.btn-draw{font:inherit;font-weight:900;font-size:1.15rem;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn-draw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-draw:disabled{opacity:.5;cursor:not-allowed}
.count{margin:10px 0 0;color:var(--muted);font-size:.95rem}
.result{display:flex;gap:14px;align-items:center;flex:2 1 300px;min-width:0}
.result[hidden]{display:none}
.result .poster{width:78px;height:110px;flex:none}
.result h2{margin:0;font-size:1.4rem;line-height:1.2;overflow-wrap:anywhere}
.result .meta{color:var(--muted);margin:2px 0 10px;font-size:.92rem}
.result .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:.92rem;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--seen);border-color:var(--seen);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1c17}
.rolling h2{opacity:.55}

.dirsel{display:block;margin-top:12px}
.dirsel label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.dirsel select{font:inherit;font-weight:500;width:100%;max-width:320px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:8px 10px}

/* barre */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:.9rem;background:transparent;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.progress{margin-left:auto;font-size:.9rem;color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.meter i{display:block;height:100%;background:var(--seen);width:0;transition:width .3s}

/* tableau */
.tablewrap{overflow-x:auto;background:var(--panel);border:2px solid var(--ink);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.picked td{background:color-mix(in srgb,var(--accent) 22%,transparent)}
td.t{font-weight:700}
td.t small{display:block;font-weight:400;color:var(--muted)}
td.y{white-space:nowrap;color:var(--muted)}
.poster{width:44px;height:62px;border-radius:6px;border:2px solid var(--ink);overflow:hidden;position:relative;display:flex;align-items:flex-end;justify-content:center;background-size:cover;background-position:center;padding:0;font:inherit}
.poster span{font-size:.62rem;font-weight:900;color:#fff;text-align:center;line-height:1.05;padding:3px 2px;text-shadow:0 1px 2px rgba(0,0,0,.55);width:100%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.poster.img span{display:none}
.status{font:inherit;font-weight:700;font-size:.88rem;border-radius:999px;padding:5px 12px;cursor:pointer;border:2px solid transparent;white-space:nowrap}
.status.seen{background:var(--seen-bg);color:var(--seen);border-color:var(--seen)}
.status.unseen{background:var(--unseen-bg);color:var(--unseen);border-color:var(--unseen)}
.pin{font:inherit;font-size:1.25rem;line-height:1;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px}
.pin.on{color:var(--accent)}
.title-btn{font:inherit;font-weight:700;text-align:left;background:none;border:0;padding:0;color:inherit;cursor:pointer}
.title-btn:hover{text-decoration:underline}
.onlylist{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;font-weight:700;color:var(--muted)}
.onlylist input{width:18px;height:18px;accent-color:var(--seen)}
dialog{border:2px solid var(--ink);border-radius:20px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.fiche{display:flex;gap:16px;padding:20px;flex-wrap:wrap}
.fiche .poster{width:120px;height:170px;flex:none}
.fiche-body{flex:1 1 220px;min-width:0}
.fiche h2{margin:0;font-size:1.35rem;line-height:1.2}
.fiche .meta{color:var(--muted);margin:2px 0 10px;font-size:.92rem}
.fiche p.syn{margin:0 0 14px}
.fiche .actions{display:flex;gap:8px;flex-wrap:wrap}
.fiche-close{margin-left:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{margin-top:14px;color:var(--muted);font-size:.85rem}
@media (max-width:640px){
  .tablewrap{overflow-x:visible}
  table,tbody{display:block;min-width:0}
  thead{display:none}
  tr{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"p t t t" "p d d d" "p s r n";gap:2px 12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{display:block;padding:0;border:0}
  td.p{grid-area:p;align-self:start}
  td.t{grid-area:t}
  td.y{display:none}
  td.d{grid-area:d;color:var(--muted);font-size:.9rem}
  td.d::before{content:attr(data-y) " · "}
  td.s{grid-area:s;margin-top:6px;justify-self:start}
  td.n{grid-area:n;margin-top:6px}
  td.r{grid-area:r;margin-top:6px;justify-self:end}
  td.r:empty{display:none}
  tr.picked{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  tr.picked td{background:none}
  .poster{width:56px;height:80px}
}
.note{font-weight:900;white-space:nowrap}
.note small{font-weight:400;color:var(--muted)}
.rating-label{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 4px}
/* Calcifer : carré de 250 px de l'image (assets/calcifer.png, 447×447) centré sur le milieu des yeux (240, 182),
   soit x 115→365, y 57→307. Taille d'affichage pilotée par --s : fond = 447/250 × s, décalage = -115/250 × s et -57/250 × s. */
.calc{--s:28px;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;flex:none;
  background:url("assets/calcifer.png") no-repeat;background-size:calc(var(--s)*1.788) calc(var(--s)*1.788);
  background-position:calc(var(--s)*-.46) calc(var(--s)*-.228);
  filter:grayscale(1) brightness(.55);opacity:.45;transition:filter .15s,opacity .15s,transform .15s}
/* allumé : l'image orange est décalée en teinte (--hr) → bleu violacé (note 1) … rouge vif (note 10) */
.calc.on{filter:hue-rotate(var(--hr,0deg)) saturate(1.6);opacity:1}
.note .calc{--s:20px;vertical-align:-5px;margin-right:4px}
/* Note : un seul grand Calcifer + un vrai slider. La couleur suit le curseur en continu (variables posées en JS). */
.calc.big{--s:72px;filter:hue-rotate(var(--hr,0deg)) saturate(var(--sat,1)) grayscale(var(--g,1)) brightness(var(--b,.55));opacity:var(--o,.45)}
.rate-row{display:flex;align-items:center;gap:14px;margin:0 0 4px}
.rate-col{flex:1;min-width:0}
.slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:12px;border-radius:99px;margin:10px 0;cursor:pointer;
  background:linear-gradient(90deg,#3d63ff,#8a4dff,#d03cff,#ff3cb4,#ff2a3a);outline-offset:6px;touch-action:pan-y}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--panel);border:3px solid var(--ink)}
.slider::-moz-range-track{background:transparent}
.rating-val{font-size:1.1rem;font-weight:900;margin:0;min-height:1.4em}
.rating-hint{font-size:.8rem;color:var(--muted);margin:0 0 14px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.empty{text-align:center;color:var(--muted);padding:22px 12px}
.sync{font-weight:700}
.sync.bad{color:#c0392b}
.foot button{font:inherit;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:640px){
  tbody tr:hover td{background:none}
  .calc.big{--s:64px}
  .fiche{padding:16px}
  .fiche .poster{width:96px;height:136px}
}
button{touch-action:manipulation}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mes films Ghibli</h1>
  <p class="sub">Coche ceux que tu as vus, puis laisse le hasard choisir le prochain.</p>

  <section class="draw" aria-live="polite">
    <div class="draw-main">
      <button class="btn-draw" id="drawBtn" type="button">Tirer un film au hasard</button>
      <div class="dirsel">
        <label for="dir">Réalisateur du tirage</label>
        <select id="dir"></select>
      </div>
      <label class="onlylist"><input type="checkbox" id="onlyList"> Tirer seulement dans ma liste ★</label>
      <p class="count" id="count"></p>
    </div>
    <div class="result" id="result" hidden>
      <div class="poster" id="rPoster" role="img"><span></span></div>
      <div>
        <h2 id="rTitle"></h2>
        <p class="meta" id="rMeta"></p>
        <div class="actions">
          <button class="btn primary" id="rSeen" type="button">Marquer comme vu</button>
          <button class="btn" id="rAgain" type="button">Un autre</button>
        </div>
      </div>
    </div>
  </section>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Filtrer">
      <button class="tab" data-f="all" aria-pressed="true" type="button">Tous</button>
      <button class="tab" data-f="unseen" aria-pressed="false" type="button">Pas vus</button>
      <button class="tab" data-f="seen" aria-pressed="false" type="button">Vus</button>
      <button class="tab" data-f="next" aria-pressed="false" type="button">Ma liste ★</button>
      <button class="tab" data-f="rank" aria-pressed="false" type="button">Classement</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="meter"><i id="meter"></i></div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Affiche</th><th>Film</th><th>Année</th><th>Réalisateur</th><th>Statut</th><th>Note</th><th>Ma liste</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden></p>
  <p class="foot">Tes films vus, tes notes et ta liste sont enregistrés dans Firebase. <span id="sync" class="sync"></span> <button id="reset" type="button">Tout réinitialiser</button></p>
  <dialog id="fiche" aria-labelledby="fTitle">
    <div class="fiche">
      <div class="poster" id="fPoster" role="img"><span></span></div>
      <div class="fiche-body">
        <h2 id="fTitle"></h2>
        <p class="meta" id="fMeta"></p>
        <p class="syn" id="fSyn"></p>
        <div id="fRateBox" hidden>
          <p class="rating-label" id="fRateLabel"></p>
          <div class="rate-row">
            <span class="calc big" id="fCalc" aria-hidden="true"></span>
            <div class="rate-col">
              <input class="slider" id="fSlider" type="range" min="0" max="10" step="1" value="0" aria-label="Ta note sur 10">
              <p class="rating-val" id="fRateVal" aria-live="polite"></p>
            </div>
          </div>
          <p class="rating-hint">Glisse le curseur ; remets-le à 0 pour retirer la note.</p>
        </div>
        <div class="actions">
          <button class="btn primary" id="fSeen" type="button"></button>
          <button class="btn" id="fNext" type="button"></button>
          <button class="btn fiche-close" id="fClose" type="button">Fermer</button>
        </div>
      </div>
    </div>
  </dialog>
</div>

<script type="module">
import * as cloud from "./src/firebase.js";
import { FILM_INFO } from "./src/filmInfo.js";

const FILMS=[
 {id:1,fr:"Nausicaä de la vallée du vent",en:"Nausicaä of the Valley of the Wind",y:1984,d:"Hayao Miyazaki",p:"https://upload.wikimedia.org/wikipedia/en/b/bc/Nausicaaposter.jpg"},
 {id:2,fr:"Le Château dans le ciel",en:"Castle in the Sky",y:1986,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/npOnzAbLh6VOIu3naU5QaEcTepo.jpg"},
 {id:3,fr:"Le Tombeau des lucioles",en:"Grave of the Fireflies",y:1988,d:"Isao Takahata",p:"https://image.tmdb.org/t/p/w342/qG3RYlIVpTYclR9TYIsy8p7m7AT.jpg"},
 {id:4,fr:"Mon voisin Totoro",en:"My Neighbor Totoro",y:1988,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/rtGDOeG9LzoerkDGZF9dnVeLppL.jpg"},
 {id:5,fr:"Kiki la petite sorcière",en:"Kiki's Delivery Service",y:1989,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/7nO5DUMnGUuXrA4r2h6ESOKQRrx.jpg"},
 {id:6,fr:"Souvenirs goutte à goutte",en:"Only Yesterday",y:1991,d:"Isao Takahata",p:"https://image.tmdb.org/t/p/w342/xjJU6rwzLX7Jk8HFQfVW6H5guMC.jpg"},
 {id:7,fr:"Porco Rosso",en:"Porco Rosso",y:1992,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/byKAndF6KQSDpGxp1mTr23jPbYp.jpg"},
 {id:8,fr:"Je peux entendre l'océan",en:"Ocean Waves",y:1993,d:"Tomomi Mochizuki",p:"https://upload.wikimedia.org/wikipedia/en/e/ea/Umigakikoeru_poster.jpg"},
 {id:9,fr:"Pompoko",en:"Pom Poko",y:1994,d:"Isao Takahata",p:"https://image.tmdb.org/t/p/w342/kowo9E1e1JcWLXj9cCvAOFZcy5n.jpg"},
 {id:10,fr:"Si tu tends l'oreille",en:"Whisper of the Heart",y:1995,d:"Yoshifumi Kondō",p:"https://image.tmdb.org/t/p/w342/5E3Hvbu0bg38ouYf6chGftVGqZ7.jpg"},
 {id:11,fr:"Princesse Mononoké",en:"Princess Mononoke",y:1997,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/jHWmNr7m544fJ8eItsfNk8fs2Ed.jpg"},
 {id:12,fr:"Mes voisins les Yamada",en:"My Neighbors the Yamadas",y:1999,d:"Isao Takahata",p:"https://image.tmdb.org/t/p/w342/wTGuHmMIBBgKakY80J1D52VvQKI.jpg"},
 {id:13,fr:"Le Voyage de Chihiro",en:"Spirited Away",y:2001,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/39wmItIWsg5sZMyRUHLkWBcuVCM.jpg"},
 {id:14,fr:"Le Royaume des chats",en:"The Cat Returns",y:2002,d:"Hiroyuki Morita",p:"https://image.tmdb.org/t/p/w342/avPMO5cnaGHgLaNiAIhy33WoQLm.jpg"},
 {id:15,fr:"Le Château ambulant",en:"Howl's Moving Castle",y:2004,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/TkTPELv4kC3u1lkloush8skOjE.jpg"},
 {id:16,fr:"Les Contes de Terremer",en:"Tales from Earthsea",y:2006,d:"Gorō Miyazaki",p:"https://image.tmdb.org/t/p/w342/67yYwCPq7NbxSF6BIIXCMD34sY0.jpg"},
 {id:17,fr:"Ponyo sur la falaise",en:"Ponyo",y:2008,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/mikKSEdk5kLhflWXbp4S5mmHsDo.jpg"},
 {id:18,fr:"Arrietty, le petit monde des chapardeurs",en:"Arrietty",y:2010,d:"Hiromasa Yonebayashi",p:"https://image.tmdb.org/t/p/w342/oc2OB2KDmSRDMelKEAA1n4YRQL0.jpg"},
 {id:19,fr:"La Colline aux coquelicots",en:"From Up on Poppy Hill",y:2011,d:"Gorō Miyazaki",p:"https://image.tmdb.org/t/p/w342/rRLYX4RZIyloHSJwvZKAhphAjiB.jpg"},
 {id:20,fr:"Le Vent se lève",en:"The Wind Rises",y:2013,d:"Hayao Miyazaki",p:"https://image.tmdb.org/t/p/w342/jfwSexzlIzaOgxP9A8bTA6t8YYb.jpg"},
 {id:21,fr:"Le Conte de la princesse Kaguya",en:"The Tale of the Princess Kaguya",y:2013,d:"Isao Takahata",p:"https://image.tmdb.org/t/p/w342/mWRQNlWXYYfd2z4FRm99MsgHgiA.jpg"},
 {id:22,fr:"Souvenirs de Marnie",en:"When Marnie Was There",y:2014,d:"Hiromasa Yonebayashi",p:"https://image.tmdb.org/t/p/w342/vug1dvDI1tSa60Z8qjCuUE7ntkO.jpg"},
 {id:23,fr:"La Tortue rouge",en:"The Red Turtle",y:2016,d:"Michaël Dudok de Wit",p:"https://image.tmdb.org/t/p/w342/wOBU3SLjQ9358Km9YWYasPZyebp.jpg"},
 {id:24,fr:"Aya et la sorcière",en:"Earwig and the Witch",y:2020,d:"Gorō Miyazaki",p:"https://image.tmdb.org/t/p/w342/sJhFtY3eHuvvACaPpxpzdCLQqpQ.jpg"},
 {id:25,fr:"Le Garçon et le Héron",en:"The Boy and the Heron",y:2023,d:"Hayao Miyazaki",p:"https://upload.wikimedia.org/wikipedia/en/4/41/How_Do_You_Live_poster.jpg"}
];

let seen={}, next={}, ratings={}, filter="all", picked=null;
try{ seen=JSON.parse(localStorage.getItem("ghibli_seen")||"{}"); }catch(e){}
try{ ratings=JSON.parse(localStorage.getItem("ghibli_ratings")||"{}"); }catch(e){}
try{ next=JSON.parse(localStorage.getItem("ghibli_next")||"{}"); }catch(e){}
// localStorage = cache local (affichage instantané + hors-ligne) ; Firebase = source partagée.
function cacheSeen(){ try{localStorage.setItem("ghibli_seen",JSON.stringify(seen));}catch(e){} }
function cacheRatings(){ try{localStorage.setItem("ghibli_ratings",JSON.stringify(ratings));}catch(e){} }
function cacheNext(){ try{localStorage.setItem("ghibli_next",JSON.stringify(next));}catch(e){} }

const $=id=>document.getElementById(id);

/* ---------- synchronisation Firebase ---------- */
const online=cloud.isConfigured();
function setSync(txt,bad){ const el=$("sync"); el.textContent=txt; el.classList.toggle("bad",!!bad); }
const onlyTrue=o=>Object.fromEntries(Object.entries(o||{}).filter(([,v])=>v)); // ne garde que les films vus
function cloudCall(fn){ if(!online) return; fn().then(()=>setSync("☁ Synchronisé")).catch(e=>{console.error(e);setSync("⚠ Échec de la synchronisation",true);}); }

function startSync(){
  if(!online){ setSync("Mode local : enregistré sur cet appareil seulement"); return; }
  setSync("☁ Connexion…");
  const onErr=e=>{ console.error(e); setSync("⚠ Firebase inaccessible (règles ou réseau)",true); };
  // Document absent côté Firebase (1re ouverture) : on y envoie ce qui existait déjà en local.
  const migrate=(name,local)=>{ if(Object.keys(local).length) cloud.pushAll(name,local).catch(onErr); };
  cloud.subscribe("seen",s=>{
    if(s.hasPendingWrites) return;
    if(!s.exists){ migrate("seen",seen); return; }
    seen=onlyTrue(s.data); cacheSeen(); refresh(); setSync("☁ Synchronisé");
  },onErr).catch(onErr);
  cloud.subscribe("ratings",s=>{
    if(s.hasPendingWrites) return;
    if(!s.exists){ migrate("ratings",ratings); return; }
    ratings=s.data; cacheRatings(); refresh();
  },onErr).catch(onErr);
  cloud.subscribe("next",s=>{
    if(s.hasPendingWrites) return;
    if(!s.exists){ migrate("next",next); return; }
    next=onlyTrue(s.data); cacheNext(); refresh();
  },onErr).catch(onErr);
}

function setSeen(id,v){
  if(v) seen[id]=true; else delete seen[id];
  cacheSeen();
  cloudCall(()=>cloud.setSeen(id,v));
  if(!v&&ratings[id]) setRating(id,null); // plus vu : la note n'a plus de sens
  if(v&&next[id]) setNext(id,false); // un film vu quitte la liste « à regarder »
  else refresh();
}
function setRating(id,v){
  if(v) ratings[id]=v; else delete ratings[id];
  cacheRatings(); refresh();
  cloudCall(()=>cloud.setRating(id,v));
}
function setNext(id,v){
  if(v) next[id]=true; else delete next[id];
  cacheNext(); refresh();
  cloudCall(()=>cloud.setNext(id,v));
}
// re-rend la liste + la fiche si elle est ouverte
function refresh(){ render(); if(ficheId&&$("fiche").open) fillFiche(FILMS.find(f=>f.id===ficheId)); }
// Décalage de teinte appliqué au Calcifer (orange, ~35°) pour la note n : 1 → bleu violacé (~275°), 10 → rouge (~357°),
// en passant par violet et magenta (on monte, on ne traverse pas vert/jaune). Valeurs réglées à l'œil.
const hueShift=n=>Math.round(240+(n-1)/9*90)+"deg";
let dirFilter="", onlyList=false, ficheId=null;
const unseenList=()=>FILMS.filter(f=>!seen[f.id]&&(!dirFilter||f.d===dirFilter)&&(!onlyList||next[f.id]));

function posterStyle(f){
  // affiche officielle (f.p), sinon dégradé.
  // Le dégradé reste dessous : si l'affiche ne charge pas, il s'affiche à la place.
  const h=(f.id*47)%360;
  const grad=`linear-gradient(160deg,hsl(${h} 45% 52%),hsl(${(h+40)%360} 50% 32%))`;
  const src=f.p;
  if(src) return {img:true, css:`background-image:url('${src}'),${grad}`};
  return {img:false, css:`background-image:${grad}`};
}
function posterHTML(f){
  const p=posterStyle(f);
  return `<div class="poster${p.img?" img":""}" style="${p.css}" role="img" aria-label="Affiche de ${f.fr}"><span>${f.fr.split(" ").slice(0,3).join(" ")}</span></div>`;
}

function render(){
  let list=FILMS.filter(f=>filter==="all"||(filter==="seen"?seen[f.id]:filter==="next"?next[f.id]:filter==="rank"?ratings[f.id]:!seen[f.id]));
  if(filter==="rank") list.sort((a,b)=>ratings[b.id]-ratings[a.id]||a.y-b.y); // meilleure note d'abord, égalité : le plus ancien
  const emptyMsg={rank:"Aucune note pour l'instant : ouvre la fiche d'un film vu pour le noter.",next:"Ta liste est vide : ajoute des films avec ☆.",seen:"Tu n'as encore marqué aucun film comme vu."}[filter];
  $("empty").hidden=!(emptyMsg&&!list.length); $("empty").textContent=emptyMsg||"";
  $("rows").innerHTML=list.map((f,i)=>`
    <tr class="${picked===f.id?"picked":""}" data-id="${f.id}">
      <td class="p">${posterHTML(f)}</td>
      <td class="t"><button class="title-btn" data-fiche="${f.id}" type="button">${filter==="rank"?"#"+(i+1)+" · ":""}${f.fr}</button><small>${f.en}</small></td>
      <td class="y">${f.y}</td>
      <td class="d" data-y="${f.y}">${f.d}</td>
      <td class="s"><button class="status ${seen[f.id]?"seen":"unseen"}" data-seen="${f.id}" type="button">${seen[f.id]?"Vu":"Pas vu"}</button></td>
      <td class="r">${ratings[f.id]?`<span class="note"><span class="calc on" style="--hr:${hueShift(ratings[f.id])}" aria-hidden="true"></span>${ratings[f.id]}<small>/10</small></span>`:""}</td>
      <td class="n">${seen[f.id]?"":`<button class="pin${next[f.id]?" on":""}" data-next="${f.id}" aria-pressed="${!!next[f.id]}" aria-label="${next[f.id]?"Retirer de":"Ajouter à"} ma liste : ${f.fr}" type="button">${next[f.id]?"★":"☆"}</button>`}</td>
    </tr>`).join("");
  const n=FILMS.filter(f=>seen[f.id]).length, left=FILMS.length-n;
  $("progress").textContent=`${n} vus sur ${FILMS.length}`;
  $("meter").style.width=(n/FILMS.length*100)+"%";
  const pool=unseenList().length;
  $("count").textContent=!left?"Tu les as tous vus !":!pool?(onlyList?"Ta liste est vide pour ce tirage : ajoute des films avec ☆.":`Tu as déjà vu tous les films de ${dirFilter}.`):`${pool} film${pool>1?"s":""} ${onlyList?"dans ta liste":"en attente"}${dirFilter?" de "+dirFilter:""}`;
  $("drawBtn").disabled=!pool;
  if(picked && seen[picked]) { $("rSeen").hidden=true; } else { $("rSeen").hidden=false; }
}

function showResult(f,rolling){
  const r=$("result"); r.hidden=false; r.classList.toggle("rolling",!!rolling);
  const p=posterStyle(f), el=$("rPoster");
  el.className="poster"+(p.img?" img":""); el.style.cssText=p.css; el.setAttribute("aria-label","Affiche de "+f.fr);
  el.firstElementChild.textContent=f.fr.split(" ").slice(0,3).join(" ");
  $("rTitle").textContent=f.fr;
  $("rMeta").textContent=`${f.en} — ${f.y}, ${f.d}`;
}

function fillFiche(f){
  const p=posterStyle(f), el=$("fPoster"), info=FILM_INFO[f.id]||{};
  el.className="poster"+(p.img?" img":""); el.style.cssText=p.css; el.setAttribute("aria-label","Affiche de "+f.fr);
  el.firstElementChild.textContent=f.fr.split(" ").slice(0,3).join(" ");
  $("fTitle").textContent=f.fr;
  $("fMeta").textContent=`${f.en} — ${f.y}, ${f.d}${info.m?", "+Math.floor(info.m/60)+" h "+String(info.m%60).padStart(2,"0"):""}`;
  $("fSyn").textContent=info.s||"";
  $("fRateBox").hidden=!seen[f.id];
  const r=ratings[f.id]||0;
  $("fRateLabel").textContent=r?"Ta note":"Tu l'as vu ! Quelle note lui donnes-tu ?";
  $("fSlider").value=r; paintRating(r);
  $("fSeen").textContent=seen[f.id]?"Marquer pas vu":"Marquer comme vu";
  $("fSeen").dataset.seen=f.id;
  $("fNext").hidden=!!seen[f.id];
  $("fNext").textContent=next[f.id]?"★ Dans ma liste":"☆ Ajouter à ma liste";
  $("fNext").dataset.next=f.id;
}
function openFiche(id){ ficheId=id; fillFiche(FILMS.find(f=>f.id===id)); if(!$("fiche").open) $("fiche").showModal(); }
// Slider : `input` = aperçu en direct (couleur du Calcifer), `change` (relâchement) = enregistrement.
// Calcifer éteint (gris) à 0 ; de 1 à 10, la teinte glisse du bleu violacé au rouge.
function paintRating(n){
  const c=$("fCalc").style;
  if(n>0){ c.setProperty("--hr",hueShift(n)); c.setProperty("--sat","1.6"); c.setProperty("--g","0"); c.setProperty("--b","1"); c.setProperty("--o","1"); }
  else { c.setProperty("--sat","1"); c.setProperty("--g","1"); c.setProperty("--b",".55"); c.setProperty("--o",".45"); }
  $("fRateVal").textContent=n?`${n} / 10`:"Pas de note";
  $("fSlider").setAttribute("aria-valuetext",n?`${n} sur 10`:"pas de note");
}
$("fSlider").addEventListener("input",e=>paintRating(+e.target.value));
$("fSlider").addEventListener("change",e=>{ const v=+e.target.value; if(ficheId) setRating(ficheId,v||null); });
$("fClose").addEventListener("click",()=>$("fiche").close());
$("fiche").addEventListener("click",e=>{ if(e.target===$("fiche")) $("fiche").close(); }); // clic sur le fond

let timer=null;
function draw(){
  const pool=unseenList(); if(!pool.length||timer) return;
  const choice=pool[Math.floor(Math.random()*pool.length)];
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i=0, steps=reduce?0:12;
  $("drawBtn").disabled=true;
  const tick=()=>{
    if(i<steps){ showResult(pool[Math.floor(Math.random()*pool.length)],true); i++; timer=setTimeout(tick,70+i*12); }
    else { timer=null; picked=choice.id; showResult(choice,false); render();
      const row=document.querySelector("tr.picked"); if(row&&filter!=="seen") row.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"}); }
  };
  tick();
}

const dirs=[...new Set(FILMS.map(f=>f.d))].sort((a,b)=>FILMS.filter(f=>f.d===b).length-FILMS.filter(f=>f.d===a).length||a.localeCompare(b));
$("dir").innerHTML='<option value="">Tous les réalisateurs</option>'+dirs.map(d=>`<option value="${d}">${d} (${FILMS.filter(f=>f.d===d).length})</option>`).join("");
$("dir").addEventListener("change",e=>{dirFilter=e.target.value;render();});
$("drawBtn").addEventListener("click",draw);
$("rAgain").addEventListener("click",draw);
$("onlyList").addEventListener("change",e=>{onlyList=e.target.checked;render();});
$("rSeen").addEventListener("click",()=>{ if(picked){ setSeen(picked,true); openFiche(picked); } });

document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  filter=b.dataset.f;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t===b));
  render();
});
document.body.addEventListener("click",e=>{
  const t=e.target.closest("[data-fiche]");
  if(t){ openFiche(+t.dataset.fiche); return; }
  const n=e.target.closest("[data-next]");
  if(n){ const id=+n.dataset.next; setNext(id,!next[id]); return; }
  const s=e.target.closest("[data-seen]");
  if(s){
    const id=+s.dataset.seen;
    if(seen[id]) setSeen(id,false);
    else { setSeen(id,true); openFiche(id); } // marqué vu : on propose directement de noter
    return;
  }
  const row=e.target.closest("tr[data-id]");
  if(row){ openFiche(+row.dataset.id); }
});
$("reset").addEventListener("click",()=>{
  if(confirm("Remettre tous les films à « Pas vu », et vider ta liste et tes notes ?")){
    seen={}; next={}; ratings={}; picked=null; $("result").hidden=true;
    try{localStorage.removeItem("ghibli_seen");localStorage.removeItem("ghibli_next");localStorage.removeItem("ghibli_ratings");}catch(e){}
    cloudCall(()=>cloud.resetAll());
    render();
  }
});
render();
startSync();
</script>
</body>
</html>
